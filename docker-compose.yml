version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Relational Database: PostgreSQL 16
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: profilease-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: profilease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d profilease']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - profilease-net

  # -------------------------------------------------------------
  # 2. In-Memory Cache: Redis 7
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: profilease-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - profilease-net

  # -------------------------------------------------------------
  # 3. Message Broker: RabbitMQ 3 Management
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: profilease-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'   # AMQP protocol port
      - '15672:15672' # RabbitMQ Management Web Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - profilease-net

  # -------------------------------------------------------------
  # 4. Notification Microservice: NestJS + Handlebars + Terminus
  # -------------------------------------------------------------
  notifications:
    build:
      context: .
      dockerfile: Dockerfile.notifications
    container_name: profilease-notifications
    restart: unless-stopped
    ports:
      - '3333:3333'
    environment:
      NODE_ENV: production
      PORT: 3333
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - profilease-net

  # -------------------------------------------------------------
  # 5. Web Platform & Multi-Tenant Engine: Angular v22 SSR
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: profilease-web
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/profilease
      REDIS_URL: redis://redis:6379
      NOTIFICATION_SERVICE_URL: http://notifications:3333/api/notifications/dispatch
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notifications:
        condition: service_started
    networks:
      - profilease-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  profilease-net:
    driver: bridge
