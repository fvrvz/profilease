name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set Nx SHAs for diff calculation
        uses: nrwl/nx-set-shas@v4

      - name: Test affected projects only (Difference Test)
        run: npx nx affected -t test --parallel=2

      - name: Strict TypeScript Verification
        run: |
          npx tsc -p apps/web/tsconfig.app.json --noEmit
          npx tsc -p apps/notifications/tsconfig.app.json --noEmit
